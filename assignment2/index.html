<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="shapeCalLogic.js"></script>
  <title>Geometric Calculation</title>
</head>
<body>
  <div class="container mx-auto p-8 flex flex-col items-center"> 
    <h1 class="text-center text-3xl text-blue-600 font-bold">Geometric Calculation</h1>
    <h3 class="text-center text-lg text-gray-700">Choose a shape you want to calculate</h3>
    <hr class="my-4 w-full border-t border-gray-300">
    <div class="flex flex-row py-4">
      <label for="options" >Choose a shape:</label>
      <select class="text-blue-600" id="options" name="options" onchange="showInputForm()">
        <option class="text-blue-600" value="triangle">Triangle</option>
        <option class="text-blue-600" value="rectangle">Rectangle</option>
        <option class="text-blue-600" value="circle">Circle</option>
      </select>
    </div>
    <div id="inputForm">
    </div>
    <div id="result" class="mt-4 text-lg text-green-600">
    </div>
    <div id="shape" class="mt-4">

    </div>
  </div>
  
  <script>
    function showInputForm(){
      const selectedShape = document.getElementById("options").value;

      const inputForm = document.getElementById("inputForm");
      inputForm.innerHTML = ""; // Clear previous inputs

      let htmlForm = `
      <form id="triangleForm" class="flex flex-col" onsubmit="event.preventDefault(); calculateArea();">
        <div class="flex flex-col">
          `
      switch(selectedShape){
        case "triangle":
          htmlForm += `
              <label for="base">Base:</label>
              <input type="number" min="0" id="width" name="width" class="border p-1 mb-2" placeholder="Enter width in cm">
              <label for="height">Height:</label>
              <input type="number" min="0" id="height" name="height" class="border p-1 mb-2" placeholder="Enter height in cm">
          `;
          break;
        case "rectangle":
          htmlForm += `
                <label for="width">Width:</label>
                <input type="number" min="0" id="width" name="width" class="border p-1 mb-2" placeholder="Enter width in cm">
                <label for="height">Height:</label>
                <input type="number" min="0" id="height" name="height" class="border p-1 mb-2" placeholder="Enter height in cm">
          `;
          break;
        case "circle":
          htmlForm += `
                <label for="radius">Radius:</label>
                <input type="number" min="0" id="radius" name="radius" class="border p-1 mb-2" placeholder="Enter radius in cm">
                
          `;
          break;
        default:
          inputForm.innerHTML = "";
          return;
      }

      htmlForm += `     
          <div class="flex flex-row gap-2 mt-2">
            <button type="button" onclick="drawShape()" class="bg-purple-500 text-white p-2 rounded">Draw Shape</button>
            <button type="submit" class="bg-blue-500 text-white p-2 rounded">Calculate Area</button>  
          </div>
        </div>
      </form>
            `;
      inputForm.innerHTML = htmlForm;
    }

    function calculateArea(){
      const selectedShape = document.getElementById("options").value;

      const dimensions = {
        width: document.getElementById("width") ? parseFloat(document.getElementById("width").value) : 0,
        height: document.getElementById("height") ? parseFloat(document.getElementById("height").value) : 0,
        radius: document.getElementById("radius") ? parseFloat(document.getElementById("radius").value) : 0,
      };

      const area = geometry.calculateArea(selectedShape, dimensions);

      document.getElementById("result").innerText = `The area of the ${selectedShape} is: ${area}`;
    }

    function drawShape(){
      const shapeDiv = document.getElementById("shape");
      const selectedShape = document.getElementById("options").value;

      const dimensions = {
        width: document.getElementById("width") ? parseFloat(document.getElementById("width").value) : 0,
        height: document.getElementById("height") ? parseFloat(document.getElementById("height").value) : 0,
        radius: document.getElementById("radius") ? parseFloat(document.getElementById("radius").value) : 0,
      };

      expandDimensions(dimensions);
      
       // Reset previous styles
      resetShapeDiv();
      if(selectedShape === "triangle"){
        if(!dimensions.width || !dimensions.height){
          alert("Please enter base and height");
          return;
        }

        shapeDiv.style.borderLeft = `${dimensions.width/2}px solid transparent`;
        shapeDiv.style.borderRight = `${dimensions.width/2}px solid transparent`;
        shapeDiv.style.borderBottom = `${dimensions.height}px solid blue`;
      }
      else if(selectedShape === "rectangle"){
        if(!dimensions.width || !dimensions.height){
          alert("Please enter width and height");
          return;
        }

        shapeDiv.style.width = `${dimensions.width}px`;
        shapeDiv.style.height = `${dimensions.height}px`;
        shapeDiv.style.backgroundColor = "violet";
      }
      else if(selectedShape === "circle"){
        if(!dimensions.radius){
          alert("Please enter radius");
          return;
        }

        shapeDiv.style.width = `${dimensions.radius * 2}px`;
        shapeDiv.style.height = `${dimensions.radius * 2}px`;
        shapeDiv.style.backgroundColor = "orange";
        shapeDiv.style.borderRadius = "50%";
      }
      else{
        alert("Invalid shape selected");
      }

      //helper function to expand dimensions if they are too small
      function expandDimensions(dimensions){
        const minDimension = 80; 
        const maxDimension = 700; 

        for (let key in dimensions) {
          if (dimensions[key] !== 0) {
            if (dimensions[key] < minDimension) {
              dimensions[key] = minDimension;
            } else if (dimensions[key] > maxDimension) {
              dimensions[key] = maxDimension;
            }
          }
        }
      }

      //helper function to reset the shape div styles
      function resetShapeDiv(){
        shapeDiv.style.width = "0px";
        shapeDiv.style.height = "0px";

        shapeDiv.style.backgroundColor = "";
        shapeDiv.style.borderRadius = "";

        shapeDiv.style.border = "";
        shapeDiv.style.borderLeft = "";
        shapeDiv.style.borderRight = "";
        shapeDiv.style.borderTop = "";
        shapeDiv.style.borderBottom = "";
      }
    }
  </script>
</body>
</html>
