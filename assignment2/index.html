<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdn.tailwindcss.com"></script>
  <title>Geometric Calculation</title>
</head>
<body>
  <h1 class="text-center text-3xl text-blue-600 font-bold">Geometric Calculation</h1>
  <h3 class="text-center text-lg text-gray-700">Choose a shape you want to calculate</h3>
  <label for="options">Choose a shape:</label>
  <select id="options" name="options" onchange="">
    <option value="triangle">Triangle</option>
    <option value="rectangle">Rectangle</option>
    <option value="circle">Circle</option>
  </select>

  <script src="script.js"></script>
</body>
</html>
