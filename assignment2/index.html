<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdn.tailwindcss.com"></script>
  <title>Geometric Calculation</title>
</head>
<body>
  <div class="container mx-auto p-8 flex flex-col items-center"> 
    <h1 class="text-center text-3xl text-blue-600 font-bold">Geometric Calculation</h1>
    <h3 class="text-center text-lg text-gray-700">Choose a shape you want to calculate</h3>
    <hr class="my-4 w-full border-t border-gray-300">
    <div class="flex flex-row py-4">
      <label for="options" >Choose a shape:</label>
      <select class="text-blue-600" id="options" name="options" onchange="handleOptionChange();">
        <option value="" disabled selected>Select a shape</option>
        <option class="text-blue-600" value="triangle">Triangle</option>
        <option class="text-blue-600" value="rectangle">Rectangle</option>
        <option class="text-blue-600" value="circle">Circle</option>
      </select>
    </div>
    <div id="inputForm">
    </div>
    <div id="result" class="mt-4 text-lg text-green-600">
    </div>
    <div id="shape" class="mt-4">

    </div>
  </div>
  <script src="shapeCalLogic.js"></script>
  <script src="ui.js"></script>
</body>
</html>
