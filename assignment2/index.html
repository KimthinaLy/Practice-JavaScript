<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="shapeCalLogic.js"></script>
  <title>Geometric Calculation</title>
</head>
<body>
  <div class="container mx-auto p-8 flex flex-col items-center"> 
    <h1 class="text-center text-3xl text-blue-600 font-bold">Geometric Calculation</h1>
    <h3 class="text-center text-lg text-gray-700">Choose a shape you want to calculate</h3>
    <hr class="my-4 w-full border-t border-gray-300">
    <div class="flex flex-row py-4">
      <label for="options" >Choose a shape:</label>
      <select class="text-blue-600" id="options" name="options" onchange="showInputForm()">
        <option class="text-blue-600" value="triangle">Triangle</option>
        <option class="text-blue-600" value="rectangle">Rectangle</option>
        <option class="text-blue-600" value="circle">Circle</option>
      </select>
    </div>
    <div id="inputForm">
    </div>
    <div id="result" class="mt-4 text-lg text-green-600">
    </div>
  </div>
  
  <script>
    function showInputForm(){
      const select = document.getElementById("options");
      const selectedShape = select.value;

      const inputForm = document.getElementById("inputForm");
      inputForm.innerHTML = ""; // Clear previous inputs
      switch(selectedShape){
        case "triangle":
          inputForm.innerHTML = `
          <form id="triangleForm" class="flex flex-col" onsubmit="event.preventDefault(); calculateArea();">
            <div class="flex flex-col">
              <label for="base">Base:</label>
              <input type="number" id="width" name="width" class="border p-1 mb-2">
              <label for="height">Height:</label>
              <input type="number" id="height" name="height" class="border p-1 mb-2">
              <button type="submit" class="bg-blue-500 text-white p-2 rounded">Calculate Area</button>
            </div>
          </form>
          `;
          break;
        case "rectangle":
          inputForm.innerHTML = `
            <form id="rectangleForm" class="flex flex-col" onsubmit="event.preventDefault(); calculateArea();">
              <div class="flex flex-col">
                <label for="width">Width:</label>
                <input type="number" id="width" name="width" class="border p-1 mb-2">
                <label for="height">Height:</label>
                <input type="number" id="height" name="height" class="border p-1 mb-2">
                <button type="submit" class="bg-blue-500 text-white p-2 rounded">Calculate Area</button>
              </div>
            </form>
          `;
          break;
        case "circle":
          inputForm.innerHTML = `
            <form id="circleForm" class="flex flex-col" onsubmit="event.preventDefault(); calculateArea();">
              <div class="flex flex-col">
                <label for="radius">Radius:</label>
                <input type="number" id="radius" name="radius" class="border p-1 mb-2">
                <button type="submit" class="bg-blue-500 text-white p-2 rounded">Calculate Area</button>
              </div>
            </form>
          `;
          break;
        default:
          inputForm.innerHTML = "";
      }
    }

    function calculateArea(){
      const shape = document.getElementById("options").value;

      const dimensions = {
        width: document.getElementById("width") ? parseFloat(document.getElementById("width").value) : null,
        height: document.getElementById("height") ? parseFloat(document.getElementById("height").value) : null,
        radius: document.getElementById("radius") ? parseFloat(document.getElementById("radius").value) : null,
      };

      const area = geometry.calculateArea(shape, dimensions);

      document.getElementById("result").innerText = `The area of the ${shape} is: ${area}`;
    }
  </script>
</body>
</html>
